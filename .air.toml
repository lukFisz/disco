root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/disco ."
  bin = "./tmp/disco"
  entrypoint = ["./tmp/disco"]
  args_bin = ["-config", "config.yaml"]
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["tmp", "examples", ".idea", ".claude"]
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
